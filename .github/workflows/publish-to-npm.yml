name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm tag to publish to (e.g., latest, beta, next)'
        required: true
        default: 'latest'
        type: 'string'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # This is required for provenance generation

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=20.0.0'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build:packages

      - name: Build bundle
        run: npm run bundle

      - name: Prepare packages for publishing
        run: npm run prepare:package

      - name: Rename packages to @srdcloud scope
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const packagesDir = 'packages';
            
            fs.readdirSync(packagesDir).forEach(dir => {
              const pkgPath = path.join(packagesDir, dir, 'package.json');
              if (fs.existsSync(pkgPath)) {
                const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                if (pkg.private !== true) {
                  pkg.name = pkg.name.replace('@google/', '@srdcloud/').replace('gemini-cli-vscode-ide-companion', '@srdcloud/gemini-cli-vscode-ide-companion');
                  fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
                  console.log(\`Updated \${pkg.name}\`);
                }
              }
            });
          "

      - name: Configure npm registry for publishing
        run: npm config set //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}

      - name: Publish packages to npm
        run: |
          for package_dir in packages/*/; do
            if [ -f "$package_dir/package.json" ]; then
              # Skip test-utils and other private packages
              if ! grep -q '"private": true' "$package_dir/package.json"; then
                echo "Publishing $(basename $package_dir)..."
                cd "$package_dir"
                npm publish --provenance --access public --tag ${{ inputs.tag || 'latest' }}
                cd - > /dev/null
              fi
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}