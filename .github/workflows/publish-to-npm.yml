name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm tag to publish to (e.g., latest, beta, next)'
        required: true
        default: 'latest'
        type: 'string'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # This is required for provenance generation

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '>=20.0.0'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Update version for nightly builds
        if: github.event_name == 'push'
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            
            // Get current timestamp
            const now = new Date();
            const timestamp = now.toISOString().split('T')[0].replace(/-/g, '');
            const gitHash = '${{ github.sha }}'.substring(0, 7);
            
            // Get base version from root package.json
            const rootPkgPath = 'package.json';
            const rootPkg = JSON.parse(fs.readFileSync(rootPkgPath, 'utf8'));
            const baseVersion = rootPkg.version.split('-')[0];
            
            // Set new nightly version
            const newVersion = \`\${baseVersion}-nightly.\${timestamp}.\${gitHash}\`;
            
            // Update root package.json
            rootPkg.version = newVersion;
            fs.writeFileSync(rootPkgPath, JSON.stringify(rootPkg, null, 2) + '\n');
            
            // Update all package.json files in packages/
            const packagesDir = 'packages';
            if (fs.existsSync(packagesDir)) {
              fs.readdirSync(packagesDir).forEach(dir => {
                const pkgPath = path.join(packagesDir, dir, 'package.json');
                if (fs.existsSync(pkgPath)) {
                  const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                  pkg.version = newVersion;
                  fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
                }
              });
            }
            
            console.log('Updated all versions to: ' + newVersion);
          "

      - name: Build packages
        run: npm run build:packages

      - name: Rename packages to @srdcloud scope (before bundle)
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const packagesDir = 'packages';
            
            fs.readdirSync(packagesDir).forEach(dir => {
              const pkgPath = path.join(packagesDir, dir, 'package.json');
              if (fs.existsSync(pkgPath)) {
                const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                if (pkg.private !== true) {
                  pkg.name = pkg.name.replace('@google/', '@srdcloud/').replace('gemini-cli-vscode-ide-companion', '@srdcloud/gemini-cli-vscode-ide-companion');
                  
                  // Fix repository URL to match the actual GitHub repository
                  if (pkg.repository && pkg.repository.url) {
                    pkg.repository.url = pkg.repository.url.replace('google-gemini/gemini-cli', 'xuxiong/gemini-cli');
                  }
                  
                  fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
                  console.log(\`Updated \${pkg.name}\`);
                }
              }
            });
          "

      - name: Update dependencies to use @srdcloud scope in package.json files
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const packagesDir = 'packages';
            
            fs.readdirSync(packagesDir).forEach(dir => {
              const pkgPath = path.join(packagesDir, dir, 'package.json');
              if (fs.existsSync(pkgPath)) {
                const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                
                // Update dependencies
                if (pkg.dependencies) {
                  Object.keys(pkg.dependencies).forEach(key => {
                    if (key.includes('@google/gemini-cli')) {
                      pkg.dependencies[key.replace('@google/', '@srdcloud/')] = pkg.dependencies[key];
                      delete pkg.dependencies[key];
                    }
                  });
                }
                
                // Update devDependencies
                if (pkg.devDependencies) {
                  Object.keys(pkg.devDependencies).forEach(key => {
                    if (key.includes('@google/gemini-cli')) {
                      pkg.devDependencies[key.replace('@google/', '@srdcloud/')] = pkg.devDependencies[key];
                      delete pkg.devDependencies[key];
                    }
                  });
                }
                
                fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
              }
            });
          "

      - name: Build bundle
        run: npm run bundle
        env:
          NPM_PUBLISH_MODE: 'true'

      - name: Prepare packages for publishing
        run: npm run prepare:package

      - name: Configure npm registry for publishing
        run: npm config set //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}

      - name: Publish packages to npm
        run: |
          for package_dir in packages/*/; do
            if [ -f "$package_dir/package.json" ]; then
              # Skip test-utils and other private packages
              if ! grep -q '"private": true' "$package_dir/package.json"; then
                echo "Publishing $(basename $package_dir)..."
                cd "$package_dir"
                npm publish --provenance --access public --tag ${{ inputs.tag || 'latest' }}
                cd - > /dev/null
              fi
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}